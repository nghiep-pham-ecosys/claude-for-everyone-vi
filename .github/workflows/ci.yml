name: ci
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"   # thứ Hai hằng tuần: bắt model mới bị deprecate

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLAUDE_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run python scripts/check_models.py
      - run: uv run python scripts/check_legacy_params.py
      - name: Mọi script bài học chạy được ở mock mode
        run: |
          for f in modules/*/python/*.py; do
            echo "::group::$f"
            uv run python "$f"
            echo "::endgroup::"
          done
      - name: Capstone chạy được ở mock mode
        run: uv run python capstones/c2-trich-xuat-pdf/pipeline.py

  live-smoke:
    # Gọi API thật, rất ít token. Cần duyệt thủ công qua GitHub Environment.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: live-api
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAX_TOKENS: "256"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python modules/01-messages-api/python/01_hello.py

  model-sync:
    # Đối chiếu config/models.yaml với Models API mỗi thứ Hai, lệch thì mở issue.
    # Tắt cho tới khi có key (CLAUDE.md, luật 1). Bật: thay `false` bằng github.event_name == 'schedule'.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/model_sync.py --issue
