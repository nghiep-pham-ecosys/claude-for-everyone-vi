# Nguồn sự thật cho mọi model ID trong repo.
# Đối chiếu: https://platform.claude.com/docs/en/models/overview
#            https://platform.claude.com/docs/en/release-notes/overview
# Kiểm tra lần cuối: 2026-10-21
#
# status:
#   active      – được dùng trong bài học
#   deprecated  – đã có lịch retire; CI cảnh báo, chỉ cho phép trong legacy/
#   retired     – gọi API sẽ lỗi; CI chặn ở mọi nơi trừ legacy/
#
# rules: các ràng buộc mà mock mode của claude_vi kiểm tra giống API thật.

default_model: claude-haiku-5-5

models:
  claude-fable-5-1:
    status: active
    price_per_mtok: {input: 10.0, output: 50.0}
    rules:
      thinking_disabled_allowed: false
      forced_tool_choice_allowed: false   # tool_choice any/tool -> 400 (release notes 2026-09-01)
      sampling_params_allowed: false
      assistant_prefill_allowed: false

  claude-opus-5-5:
    status: active
    price_per_mtok: {input: 4.0, output: 20.0}
    rules:
      thinking_disabled_allowed: false    # 2026-09-22
      forced_tool_choice_allowed: false   # 2026-09-22
      sampling_params_allowed: false
      assistant_prefill_allowed: false

  claude-sonnet-5-5:
    status: active
    price_per_mtok: {input: 2.0, output: 10.0}
    rules:
      thinking_disabled_allowed: false    # dùng {"type": "between_tools"} thay thế (2026-09-28)
      forced_tool_choice_allowed: false   # 2026-09-28
      sampling_params_allowed: false
      assistant_prefill_allowed: false

  claude-haiku-5-5:
    status: active
    price_per_mtok: {input: 0.10, output: 0.50}   # "from" – giá thấp nhất, xem trang Pricing
    rules:
      thinking_disabled_allowed: true     # chưa xác minh qua Models API – chạy model-sync để chắc
      forced_tool_choice_allowed: true    # release notes 2026-10-07 không nêu – cần live-smoke xác nhận
      sampling_params_allowed: false      # 2026-10-07
      assistant_prefill_allowed: false    # 2026-10-07

  claude-sonnet-4-5-20250929:
    status: deprecated
    retire_on: 2026-11-30

  claude-3-haiku-20240307:
    status: retired
    retired_on: 2026-04-20
